<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KilleDar Pratishthan — Interactive Brochure</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f3ead6,#17130e);
  --surface: light-dark(#fffaf0,#241d15);
  --ink: light-dark(#2d2116,#f6ead7);
  --muted: light-dark(#765f46,#c9b89f);
  --accent: light-dark(#8b1e1e,#d98b55);
  --line: light-dark(#d8c5a7,#4b3b2b);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
body{overflow-x:hidden}
#app{min-height:100vh;background:var(--bg);}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;letter-spacing:.03em;font-size:15px}
.count{font-size:12px;color:var(--muted)}
.hero{padding:24px 16px 12px;text-align:center}
.hero h1{margin:0 0 7px;font-size:clamp(24px,7vw,42px);line-height:1.05}
.hero p{margin:0;color:var(--muted);font-size:14px}
.controls{display:flex;gap:8px;justify-content:center;padding:14px 16px 18px;position:sticky;top:52px;z-index:9;background:linear-gradient(var(--bg) 70%,transparent)}
button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.progress{height:4px;background:var(--line);margin:0 16px 18px;border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.grid{max-width:980px;margin:0 auto;padding:0 12px 44px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:0 5px 18px rgba(0,0,0,.08);cursor:pointer;transition:transform .18s}
.card:hover{transform:translateY(-2px)}
.card img{display:block;width:100%;height:auto}
.card .meta{padding:8px 10px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;display:none;align-items:center;justify-content:center;padding:12px}
.overlay.open{display:flex}
.viewer{width:min(100%,900px);height:100%;display:flex;flex-direction:column;gap:10px}
.viewerbar{display:flex;justify-content:space-between;align-items:center;color:#fff}
.viewerbar button{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.viewer img{width:100%;height:calc(100% - 54px);object-fit:contain;min-height:0}
.dots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding:0 20px 20px}
.dot{width:7px;height:7px;padding:0;border-radius:50%;border:0;background:var(--line)}
.dot.active{background:var(--accent)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 30px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.hero{padding-top:36px}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><div class="brand">किल्लेदार प्रतिष्ठान</div><div class="count" id="count">21 Pages</div></header>
  <section class="hero">
    <h1>Interactive Brochure</h1>
    <p>Explore our work, fort models, events &amp; community initiatives.</p>
  </section>
  <div class="controls">
    <button id="first">Cover</button><button class="primary" id="view">Open Fullscreen</button><button id="last">Back Cover</button>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <main class="grid" id="grid"></main>
  <div class="dots" id="dots"></div>
  <div class="footer">Swipe or tap any page to read the brochure.</div>
</div>
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="viewer">
    <div class="viewerbar"><span id="vcount"></span><div><button id="prev">‹ Prev</button><button id="next">Next ›</button><button id="close">Close</button></div></div>
    <img id="vimg" alt="Brochure page">
  </div>
</div>

let idx=0;
const grid=document.getElementById('grid'), dots=document.getElementById('dots'), overlay=document.getElementById('overlay');
const vimg=document.getElementById('vimg'), vcount=document.getElementById('vcount');
pages.forEach((src,i)=>{
  const c=document.createElement('article'); c.className='card'; c.innerHTML=`<img loading="lazy" src="${src}" alt="Brochure page ${i+1}"><div class="meta"><span>Page ${i+1}</span><span>Tap to open</span></div>`; c.onclick=()=>openAt(i); grid.appendChild(c);
  const d=document.createElement('button'); d.className='dot'; d.setAttribute('aria-label','Go to page '+(i+1)); d.onclick=()=>openAt(i); dots.appendChild(d);
});
function render(){vimg.src=pages[idx];vcount.textContent=`Page ${idx+1} of ${pages.length}`;document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx));document.getElementById('bar').style.width=((idx+1)/pages.length*100)+'%';}
function openAt(i){idx=i;render();overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
function close(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow='';}
document.getElementById('view').onclick=()=>openAt(idx);
document.getElementById('close').onclick=close;
document.getElementById('prev').onclick=()=>{idx=(idx-1+pages.length)%pages.length;render()};
document.getElementById('next').onclick=()=>{idx=(idx+1)%pages.length;render()};
document.getElementById('first').onclick=()=>openAt(0);
document.getElementById('last').onclick=()=>openAt(pages.length-1);
document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')document.getElementById('prev').click();if(e.key==='ArrowRight')document.getElementById('next').click();});
let sx=0; overlay.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});
overlay.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>50){if(dx<0)document.getElementById('next').click();else document.getElementById('prev').click();}});
render();
</script>
</body></html>
